<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Previsão Bom Repouso — Status</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; color: #2b2b28; }
  h1 { font-size: 22px; }
  .card { background: #eef4ea; border-left: 4px solid #4a5d43; padding: 16px 20px; border-radius: 6px; margin-top: 20px; }
  button { background: #4a5d43; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 16px; }
  pre { background: #eee; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>🌤️ Previsão Bom Repouso</h1>
  <div class="card">
    Análise diária de geada, janela de pulverização e chuva, combinando 4 modelos meteorológicos
    (Open-Meteo) com dados da estação local. Envio automático todo dia às 5:30 (horário de Brasília).
  </div>
  <button onclick="testar()">Testar envio agora</button>
  <pre id="resultado"></pre>

  <script>
    async function testar() {
      const el = document.getElementById('resultado');
      el.textContent = 'Buscando previsão e enviando...';
      try {
        const resp = await fetch('/api/enviar-previsao');
        const data = await resp.json();
        el.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        el.textContent = 'Erro: ' + e.message;
      }
    }
  </script>
</body>
</html>
